# The Sims 3 (Xbox 360) - correcoes de analise do PrivLoader.xex.
#
# Arquivo separado do overrides.toml porque os enderecos 0x820xxxxx do
# PrivLoader caem na MESMA faixa de imagem do default.xex, que passou a ser o
# entrypoint do projeto (14/10/2026). Manter as entradas aqui impede que o
# gerador as aplique ao default.xex, onde os tres enderecos estao abaixo do
# inicio do codigo dele (0x82040000).
#
# Evidencia: codegen-priv2..5 (rexglue codegen priv_manifest.toml), disassembly
# via ferramentas/ppc_mini.py sobre LOGS/priv_image.bin.

[functions]
# memcpy com tails compartilhados. 0x820143CC e meio do word-loop, alcancado por
# b de 0x8201441C; o entry real e 0x82013E10 (prologo + 11 bl chamadores em
# 0x8201356C-0x820137B4).
"0x82013E10" = { }  # from 0x820135C0 (+10); cobre 0x820143CC via fluxo
# 0x8201441C (b 0x820143CC) esta na funcao sem prologo 0x820143F0 (apos blr em
# 0x820143EC; frameless leaf); registra o entry para cobrir o site.
"0x820143F0" = { }  # from 0x8201441C (b interno); site do UnresolvedCall
# Ancora do alvo: 0x820143CC e meio do word-loop de um cluster memcpy
# (0x82014000-0x8201441B) sem nenhuma entrada externa (zero bl/b de fora);
# codigo morto para o boot, registrado so para a validacao amarrar o b.
"0x820143CC" = { }  # alvo do b em 0x8201441C; sem chamadores externos