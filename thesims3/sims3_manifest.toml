# Manifesto ReXGlue do The Sims 3 (Xbox 360, disco base, title 454108E2).
#
# Rode daqui (thesims3/): rexglue codegen sims3_manifest.toml
#
# Cadeia de boot real (medida por disassembly dos tres XEX em 14/10/2026):
#   default.xex   entrypoint da midia (base 0x82000000, entry 0x82041028).
#                 XexLoadImage("sims3.xex") em sub_82040C10 (flags=9) e depois
#                 XexGetProcedureAddress(handle, 3) e (..., 1) em sub_82040BA0.
#                 Sem launch data do dashboard chama o ord 1; com launch data
#                 (1020 bytes) chama o ord 3 com (buffer, 1020).
#   Sims3.xex     modulo do jogo (base 0x88000000, imagem 21.495.808 B,
#                 v0.0.0.4, media 21CDDF46, AES-128 + basic). Entrada pelo
#                 export, nao pelo entry do CRT: 180 exports, ord 1 = 0x88329E58,
#                 ord 2 = 0x88329E08, ord 3 = 0x88329E10.
#   PrivLoader.xex carregado pelo default (string "privloader.xex" em
#                 0x820B0054) so como flag de copia do launch data; o codigo
#                 dele nao participa do caminho executado pelo Xenia. Fica
#                 fora do manifesto; o overrides dele vive em overrides_priv.toml.
#
# Nada do jogo e distribuido com este projeto: game_root aponta para fora do repo.

[project]
name = "sims3"
sdk_version = "0.10.0"
game_root = "../../THE SIMS 3/THE SIMS 3 (XBOX360) JTAG-RGH"

[entrypoint]
file_path = "../../THE SIMS 3/THE SIMS 3 (XBOX360) JTAG-RGH/default.xex"
out_directory_path = "generated/default"

includes = ["overrides.toml", "codegen_flavor.toml"]

# O jogo e um modulo DLL: carregado por XexLoadImage do entrypoint, resolvido
# por GetProcAddress. guest_path e o nome que o default passa ao kernel
# (string "sims3.xex" em 0x820B0050 do default, caixa baixa).
[[modules]]
guest_path = "sims3.xex"
file_path = "../../THE SIMS 3/THE SIMS 3 (XBOX360) JTAG-RGH/Sims3.xex"
out_directory_path = "generated/sims3"

includes = ["overrides.toml", "codegen_flavor.toml"]
